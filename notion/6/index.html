<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<title>音乐热歌榜组件｜Notion 小组件</title>
	<meta charset="utf-8">
    <link rel="icon" href="/favicon.svg" type="image/x-icon" />
	<link rel="stylesheet" href="https://cdn.jsdmirror.com/npm/aplayer@1.10.1/dist/APlayer.min.css">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdmirror.com/npm/swiper@11.0.5/swiper-bundle.min.css">
    <meta name="description" content="Notion 风格的音乐热歌榜组件，展示热门歌曲列表，可嵌入 Notion 页面作为听歌挂件。">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://go.88lin.eu.org/notion/6/index.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="茉灵智库">
    <meta property="og:url" content="https://go.88lin.eu.org/notion/6/index.html">
    <meta property="og:title" content="音乐热歌榜组件｜Notion 小组件">
    <meta property="og:description" content="Notion 风格的音乐热歌榜组件，展示热门歌曲列表，可嵌入 Notion 页面作为听歌挂件。">
    <meta property="og:image" content="https://go.88lin.eu.org/assets/og/notion-6.jpg">
    <meta property="og:locale" content="zh_CN">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="音乐热歌榜组件｜Notion 小组件">
    <meta name="twitter:description" content="Notion 风格的音乐热歌榜组件，展示热门歌曲列表，可嵌入 Notion 页面作为听歌挂件。">
    <meta name="twitter:image" content="https://go.88lin.eu.org/assets/og/notion-6.jpg">
</head>
<body>

<div class="swiper-container">
	 <div class="swiper-button-prev"></div>
	 <div class="swiper-button-next"></div> 
	    <div class="swiper-wrapper">
	        <div class="swiper-slide">
	          <div class="aplayer-wrap">
	          <h3 style="text-align: center">✨云音乐热歌榜✨</h3>
	          	<meting-js
	          	    list-max-height="330px"
		            server="netease"
		            type="playlist"
		            id="3778678">
	            </meting-js>  

	          </div>
	       </div>
	        <div class="swiper-slide">
	          <div class="aplayer-wrap">
	          <h3 style="text-align: center">✨云音乐飙升榜✨</h3>
	          	<meting-js
	          	    preload="none"
	          	    list-max-height="330px"
		            server="netease"
		            type="playlist"
		            id="19723756">
	            </meting-js>    
	          </div>
	        </div>
	        <div class="swiper-slide">
	          <div class="aplayer-wrap">
	          <h3 style="text-align: center">✨云音乐新歌榜✨</h3>
	          	<meting-js
	          	    preload="none"
	          	    list-max-height="330px"
		            server="netease"
		            type="playlist"
		            id="3779629">
	            </meting-js>    
	          </div>
	        </div>
	        <div class="swiper-slide">
	          <div class="aplayer-wrap">
	          <h3 style="text-align: center">✨我的网易云歌单✨</h3>
	          	<meting-js
	          	    preload="none"
	          	    list-max-height="330px"
		            server="netease"
		            type="playlist"
		            id="2141128031">
	            </meting-js>  
	          </div>
	       </div> 
	        <div class="swiper-slide">
	          <div class="aplayer-wrap">
	          <h3 style="text-align: center">✨我的QQ音乐歌单✨</h3>
	          	<meting-js
	          	    preload="none"
	          	    list-max-height="330px"
		            server="tencent"
		            type="playlist"
		            id="1953563505">
	            </meting-js>  
	          </div>
	        </div> 
        
</footer>
<script src="https://cdn.jsdmirror.com/npm/swiper@11.0.5/swiper-bundle.min.js"></script>
<script src="https://cdn.jsdmirror.com/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
<script src="https://cdn.jsdmirror.com/npm/meting@2.0.1/dist/Meting.min.js"></script>
<script>        
  var mySwiper = new Swiper ('.swiper-container', {
    loop: true, 
    
    navigation: {
      nextEl: '.swiper-button-next',
      prevEl: '.swiper-button-prev',
    },
    scrollbar: {
      el: '.swiper-scrollbar',
    },
  })       
 </script>
 
</body>
</html>

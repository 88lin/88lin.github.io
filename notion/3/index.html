<body>
    
<div id="timer">
    <div class="days"> 
        <div id="days" class="numbers "> </div>天</div> 
      <div class="hours"> 
        <div  id="hours" class="numbers"> </div>小时</div> 
      <div class="minutes"> 
        <div  id="minutes" class="numbers"> </div>分钟</div> 
      <div   class="seconds"> 
        <div id="seconds" class="numbers"> </div>秒</div> 
</div>

</body>
<script>
    const year = new Date().getFullYear();
/* 原先把年份写死成 2026，跨年之后倒计时会一直显示负数。
   这里按当前年份动态生成，并在目标日期已过时自动顺延到下一年。 */
let myDate = new Date('December 21, ' + year + ' 08:30:00');
if (myDate - new Date() < 0) {
  myDate = new Date('December 21, ' + (year + 1) + ' 08:30:00');
}

// countdown
let timer = setInterval(function() {

  // get today's date
  const today = new Date().getTime();

  // get the difference
  const diff = myDate - today;

  // math
  let days = Math.floor(diff / (1000 * 60 * 60 * 24));
  let hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  let minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
  let seconds = Math.floor((diff % (1000 * 60)) / 1000);

  // display
  document.getElementById("days").innerHTML=days
  document.getElementById("hours").innerHTML=hours
  document.getElementById("minutes").innerHTML=minutes
  document.getElementById("seconds").innerHTML=seconds
}, 1);
</script>

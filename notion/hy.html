<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎页面 | 茉灵智库</title>
    <script async src="https://019b9894-1861-76d6-9948-7ad2739a9eb8.spst2.com/ustat.js"></script>
    <style>
        /* 全局样式：Notion 小组件场景，压缩留白、自适应适配（布局对齐参考版 v2） */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "PingFang SC",
                         "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: #34495e;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #e8f6ff, #eef9fc);
            display: flex;
            padding: 4px;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* 隐藏托管平台注入的品牌栏与悬浮角标（遮挡嵌入内容），
           并压掉启动脚本为顶栏预留的 body 上边距 */
        #mulepage-bar,
        #mulepage-footer {
            display: none !important;
        }
        body {
            padding: 4px !important;
        }

        /* 主容器：撑满组件宽高，内容居中，大圆角 */
        #main-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(8px, 2vh, 18px);
            padding: clamp(16px, 3vh, 28px) clamp(12px, 3vw, 28px);
            background: #ffffff;
            border-radius: clamp(22px, 5vw, 32px);
            box-shadow: 0 6px 24px rgba(66, 165, 245, 0.12);
            text-align: center;
        }

        /* 标题样式：更鲜亮的渐变配色（字号保持原样，仅在小屏自适应缩小） */
        .welcome-header {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.7rem, 6vw, 2.5rem);
            font-weight: 800;
            background: linear-gradient(100deg, #ff6b81 0%, #ff9f43 28%, #ffd43b 50%, #3ddc97 72%, #4facfe 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0;
        }

        /* 加载动画 */
        .loading-spinner {
            width: clamp(44px, 10vw, 60px);
            height: clamp(44px, 10vw, 60px);
            border: 5px solid rgba(52, 73, 94, 0.2);
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1.2s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
            margin: 0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 欢迎信息样式（字号保持原样，仅在小屏自适应缩小） */
        .welcome-message {
            font-size: clamp(1.1rem, 3.5vw, 1.5rem);
            line-height: 1.8;
        }

        .welcome-message p {
            margin: 2px 0;
            word-break: break-word;
        }

        .welcome-message b {
            font-family: 'Roboto', sans-serif;
            font-weight: 700;
            color: #0ecffe;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        /* IP 地址样式：hover 或点击均可显示 */
        .ip-address {
            filter: blur(6px);
            transition: filter 0.3s ease, color 0.3s ease;
            cursor: pointer;
            color: #ff1900;
        }

        .ip-address:hover,
        .ip-address.revealed {
            filter: blur(0);
            color: #ff1900;
        }

        /* 错误信息 */
        .error-message {
            font-family: 'Roboto', sans-serif;
            color: #ff1900;
            font-size: clamp(1rem, 3.5vw, 1.2rem);
            font-weight: bold;
        }

        /* 按钮样式 */
        .refresh-button {
            margin-top: 0;
            padding: 8px 24px;
            font-family: 'Roboto', sans-serif;
            font-size: clamp(0.95rem, 2.8vw, 1rem);
            font-weight: 600;
            color: #fff;
            background: linear-gradient(45deg,#0ecffe 50%,#07a6f1);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* 仅在支持 hover 的设备（桌面）上启用悬浮效果，避免移动端误触位移 */
        @media (hover: hover) {
            .refresh-button:hover {
                transform: translateY(-3px);
                box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
            }
        }
    </style>
</head>
<body>
    <div id="main-container">
        <!-- 标题 -->
        <h1 class="welcome-header">欢迎来到茉灵智库</h1>
        <!-- 加载指示器 -->
        <div class="loading-spinner" id="loading-spinner"></div>
        <!-- 欢迎信息 -->
        <div class="welcome-message" id="welcome-message" style="display: none;">
            <p>欢迎来自 <b id="visitor-location"></b> 的朋友💖</p>
            <p>你当前距博主约 <b id="visitor-distance"></b> 公里🍃 </p>
            <p>你的 IP 地址：<b class="ip-address" id="visitor-ip"></b></p>
            <p id="greeting-message"></p>
            <button class="refresh-button" onclick="initialize()">刷新数据</button>
        </div>
        <!-- 错误信息 -->
        <div class="error-message" id="error-message" style="display: none;">
            <p>抱歉，无法加载访客信息</p>
        </div>
    </div>
    <script>
        const CONFIG = {
            // 中转服务：服务端调用 kEvio（失败自动降级 ip35），已带 CORS 头可跨域直连。
            // 服务端调用 kEvio（失败自动降级 ip35），返回中文地名 + 经纬度。
            API_ENDPOINT: 'https://nbr5n3s9.qwenwork.host/api/ip',
            BLOG_LOCATION: { lng: 119.38507, lat: 25.72086},
        };

        // 获取访客真实出口 IP（这两个接口支持浏览器跨域），
        // 通过 ?ip= 传给服务端：平台能识别访客头时以服务端为准，
        // 识别不到时用这里上报的 IP，双保险保证归属地准确
        const sourceFetch = (url, ms) => fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(ms) });

        const fetchVisitorIp = async () => {
            try {
                const r = await sourceFetch('https://api.ip.sb/ip', 6000);
                if (r.ok) {
                    const text = (await r.text()).trim();
                    if (/^[0-9A-Fa-f:.]{7,45}$/.test(text)) return text;
                }
            } catch (e) { console.warn('ip.sb 获取失败：', e.message); }
            try {
                const r = await sourceFetch('https://ipinfo.io/json', 6000);
                if (r.ok) {
                    const json = await r.json();
                    if (json.ip) return json.ip;
                }
            } catch (e) { console.warn('ipinfo 获取失败：', e.message); }
            return null;
        };

        const fetchIpData = async () => {
            try {
                const visitorIp = await fetchVisitorIp();
                const url = new URL(CONFIG.API_ENDPOINT, window.location.href);
                if (visitorIp) url.searchParams.set('ip', visitorIp);

                const response = await fetch(url, { signal: AbortSignal.timeout(10000) });
                if (!response.ok) {
                    throw new Error('网络错误，无法获取IP信息');
                }
                const result = await response.json();
                if (result.code !== 0 || !result.data) {
                    throw new Error(result.message || 'IP 信息接口返回异常');
                }
                return result.data;
            } catch (error) {
                console.error('Error fetching IP data:', error);
                throw error;
            }
        };

        const calculateDistance = (lng, lat) => {
            if (!Number.isFinite(lng) || !Number.isFinite(lat)) return '未知';

            const R = 6371; // 地球半径
            const rad = Math.PI / 180;
            const dLat = (lat - CONFIG.BLOG_LOCATION.lat) * rad;
            const dLon = (lng - CONFIG.BLOG_LOCATION.lng) * rad;
            const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(CONFIG.BLOG_LOCATION.lat * rad) * Math.cos(lat * rad) *
                Math.sin(dLon / 2) ** 2;
            return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        };

        const formatLocation = (country, province, city) => {
            if (!country) return '未知地区';
            if (country === '中国') return `${province || ''} ${city || ''}`.trim() || country;
            return country;
        };

        const formatIp = (ip) => String(ip || '未知IP').includes(':') ? 'IPv6 地址（隐藏）' : String(ip || '未知IP');

        const showWelcomeMessage = (location, distance, ip) => {
            document.getElementById('loading-spinner').style.display = 'none';
            document.getElementById('error-message').style.display = 'none';

            const welcomeMessage = document.getElementById('welcome-message');
            welcomeMessage.style.display = 'block';

            document.getElementById('visitor-location').textContent = location;
            document.getElementById('visitor-distance').textContent = distance;
            document.getElementById('visitor-ip').textContent = ip;
            document.getElementById('greeting-message').textContent = getGreeting();
        };

        const showErrorMessage = () => {
            document.getElementById('loading-spinner').style.display = 'none';
            document.getElementById('welcome-message').style.display = 'none';
            document.getElementById('error-message').style.display = 'block';
        };

        const getGreeting = () => {
            const hour = new Date().getHours();
            if (hour < 5) return '夜深了！🌌 别忘了休息，睡个好觉，明天更美好';
            if (hour < 11) return '早上好！🌄 一日之计在于晨！';
            if (hour < 13) return '中午好！☀️ 午饭时间到，记得吃点好吃的！';
            if (hour < 18) return '下午好！🌤️ 希望今天的你状态满满，事事顺心！';
            if (hour < 23) return '晚上好！🌙  忙碌了一天，放松一下享受宁静时光吧！';
            return '夜深了！🌌 别忘了休息，睡个好觉，明天更美好';
        };

        const initialize = async () => {
            try {
                const data = await fetchIpData();
                const { longitude, latitude, country, province, city } = data;
                const ip = data.ip || '未知IP';
                const lng = Number(longitude);
                const lat = Number(latitude);
                const location = formatLocation(country, province, city);
                const distance = calculateDistance(lng, lat);
                const formattedIp = formatIp(ip);

                showWelcomeMessage(location, `${distance}`, formattedIp);
            } catch {
                showErrorMessage();
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            // 移动端无 hover，点击 IP 也可切换显示
            const ipEl = document.getElementById('visitor-ip');
            ipEl.addEventListener('click', () => ipEl.classList.toggle('revealed'));
            initialize();
        });

        // 移除托管平台注入的品牌栏/悬浮角标（CSS 之外的双保险），
        // 并强制还原 body 边距（启动脚本会为顶栏偷偷加 padding-top 占位）
        const stripInjectedBars = () => {
            document.body.style.setProperty('padding', '4px', 'important');
            ['mulepage-bar', 'mulepage-footer'].forEach((id) => {
                const el = document.getElementById(id);
                if (el) el.remove();
            });
        };
        stripInjectedBars();
        document.addEventListener('DOMContentLoaded', stripInjectedBars);
        window.addEventListener('load', stripInjectedBars);
        setTimeout(stripInjectedBars, 500);
        new MutationObserver((mutations) => {
            for (const m of mutations) {
                for (const node of m.addedNodes) {
                    if (node.nodeType === 1 && (node.id === 'mulepage-bar' || node.id === 'mulepage-footer')) {
                        node.remove();
                        document.body.style.setProperty('padding', '4px', 'important');
                    }
                }
            }
        }).observe(document.documentElement, { childList: true, subtree: true });
    </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>迁移旧白板 · 88lin</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 48px 20px; background: #FFFCF8; color: #2F293D; font: 17px/1.8 system-ui, "Microsoft YaHei", sans-serif; }
main { max-width: 640px; margin: auto; padding: 32px; background: #fff; border: 1px solid #E4DFED; border-radius: 20px; }
h1 { margin: 0 0 16px; font-size: 1.65rem; }
a { color: #6941B0; overflow-wrap: anywhere; }
button { padding: 12px 20px; border: 0; border-radius: 12px; background: #6941B0; color: #fff; font: inherit; cursor: pointer; }
button:disabled { opacity: .55; cursor: default; }
:focus-visible { outline: 3px solid #6941B0; outline-offset: 4px; }
#status { padding: 12px; border-radius: 12px; background: #F0EAFE; overflow-wrap: anywhere; }
@media(max-width: 400px) { main { padding: 24px 20px; } }
</style>
</head>
<body>
<main>
<h1>把旧白板带到新站</h1>
<p>使用迁移前画白板的浏览器，下载一份备份，再到新站的“导出与更多操作 → 导入白板备份”中恢复。若新站已有创作，请先备份，导入会替换当前白板。</p>
<p id="status" role="status">正在检查当前域名下的旧白板……</p>
<button id="download" type="button" disabled>下载旧白板备份</button>
<p><a href="https://88lin.eu.org/system/">打开新站白板 →</a></p>
<p>没有找到？请确认正在使用原来的浏览器和设备，并尝试另一个旧地址：<a href="https://go.88lin.eu.org/whiteboard-backup/">工具导航域名</a> · <a href="https://88lin.github.io/whiteboard-backup/">GitHub 域名</a>。</p>
<p>此页只读取当前域名保存的白板并下载到本机，不上传、修改或删除原数据。清理过浏览器数据的创作无法从服务器找回。</p>
<noscript><p>请启用 JavaScript 后下载本机白板备份。</p></noscript>
</main>
<script>
(() => {
  'use strict';
  const status = document.getElementById('status');
  const button = document.getElementById('download');
  let raw;
  try {
    raw = localStorage.getItem('88lin.whiteboard.v2');
    if (!raw) {
      status.textContent = '当前域名下没有找到旧白板，请尝试下方另一个旧地址。';
      return;
    }
    // Export the original bytes even if damaged, so recovery never discards data.
    button.disabled = false;
    try {
      const data = JSON.parse(raw);
      if (data.version !== 2 || !Array.isArray(data.cards) || !Array.isArray(data.strokes)) throw Error();
      status.textContent = `找到 ${data.cards.length} 张创作卡片、${data.strokes.length} 组笔迹及保存的布局。可以下载备份。`;
    } catch {
      status.textContent = '找到了旧数据，但格式可能损坏。仍可下载原始备份留存，新站可能无法直接导入。';
    }
  } catch {
    status.textContent = '浏览器不允许读取本机存储，请在原来的浏览器中允许站点存储后重试。';
  }
  button.addEventListener('click', () => {
    const url = URL.createObjectURL(new Blob([raw], { type: 'application/json' }));
    const link = document.createElement('a');
    link.href = url;
    link.download = '88lin-whiteboard-backup.json';
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    status.textContent = '备份已下载。请打开新站白板，在下载菜单中导入这份文件。旧数据仍保留在这里。';
  });
})();
</script>
</body>
</html>

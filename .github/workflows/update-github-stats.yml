name: Refresh GitHub stats

on:
  schedule:
    # 每周日 00:00 (Asia/Shanghai)
    - cron: '0 16 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh counters in 2/index.html
        id: stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python 2/scripts/update-github-stats.py | tee -a "$GITHUB_STEP_SUMMARY"
          if git diff --quiet -- 2/index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Numbers already up to date, skipping rebuild." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            python 2/scripts/build-seo.py --updated "$(TZ=Asia/Shanghai date +%F)"
          fi

      - name: Commit and push
        if: steps.stats.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2/index.html 2/llms.txt 2/about/index.html 2/system/index.html
          git diff --cached --quiet && exit 0
          git commit -m "chore(seo): refresh GitHub stats $(TZ=Asia/Shanghai date +%F)"
          git push
